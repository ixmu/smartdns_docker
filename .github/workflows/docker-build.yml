name: Build and Push SmartDNS Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "手动指定 SmartDNS 版本 tag（如 Release48.2），留空则自动获取最新 Release"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * 0"

env:
  UPSTREAM_REPO: pymumu/smartdns
  IMAGE_NAME: smartdns
  LAST_VERSION_FILE: .github/state/last_version.txt
  # 新增：定义 Docker Hub 用户名环境变量，需在 GitHub Secrets 中配置
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} 

jobs:
  # 步骤 1：确定版本号
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine SmartDNS version
        id: ver
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          mkdir -p "$(dirname "$LAST_VERSION_FILE")"
          VERSION=""
          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="$MANUAL_VERSION"
          else
            API_RESPONSE="$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" || true)"
            VERSION="$(printf '%s' "$API_RESPONSE" | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name":[[:space:]]*"([^"]+)".*/\1/' || true)"
            if [ -z "$VERSION" ] && [ -f "$LAST_VERSION_FILE" ]; then
              VERSION="$(cat "$LAST_VERSION_FILE")"
            fi
          fi
          if [ -z "$VERSION" ]; then
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 步骤 2：使用原生机器分别构建 amd64 和 arm64 架构（速度极快）
  build-by-arch:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch_tag: amd64
          - runner: ubuntu-24.04-arm # 使用 GitHub 官方原生 ARM64 机器！
            platform: linux/arm64
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # 移除了 packages: write (DockerHub 不依赖 GitHub packages 权限)

    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4

      - name: Clone SmartDNS source
        run: |
          git clone --depth 1 --branch "${{ needs.prepare.outputs.version }}" \
            "https://github.com/${UPSTREAM_REPO}.git" src
          cp Dockerfile src/Dockerfile
          cp -r smartdns src/smartdns

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 替换为 Docker Hub 登录
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 启用 GHA 缓存，加快构建速度，推送到 Docker Hub
      - name: Build and push by digest
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            SMARTDNS_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}

  # 步骤 3：合并两个架构的 Tag，生成 Multi-Arch 镜像及 latest 标签
  merge-tags:
    needs: [prepare, build-by-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 替换为 Docker Hub 登录
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          # 创建版本 Manifest 并推送
          docker buildx imagetools create -t ${REPO}:${VERSION} \
            ${REPO}:${VERSION}-amd64 \
            ${REPO}:${VERSION}-arm64

          # 创建 latest Manifest 并推送
          docker buildx imagetools create -t ${REPO}:latest \
            ${REPO}:${VERSION}-amd64 \
            ${REPO}:${VERSION}-arm64

      # 记录最新构建的版本并提交
      - name: Record and Commit version
        run: |
          set -e
          mkdir -p "$(dirname "$LAST_VERSION_FILE")"
          echo -n "${{ needs.prepare.outputs.version }}" > "$LAST_VERSION_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAST_VERSION_FILE"
          if git diff --staged --quiet; then
            echo "版本记录无变化，跳过提交"
          else
            git commit -m "chore: update last built smartdns version to ${{ needs.prepare.outputs.version }}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi